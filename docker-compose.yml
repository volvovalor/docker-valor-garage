# Docker Compose configuration for the Valor Garage project

services:
  valor-garage:

    build: .

    ports:
      - "3000:3000"

    environment:
      DATABASE_URL: file:/app/data/garage.db
      BACKUP_DIR: /app/backups
      BACKUP_ADMIN_TOKEN: ${BACKUP_ADMIN_TOKEN:-}
      BACKGROUND_DIR: /app/backgrounds

    volumes:
      - ./data:/app/data
      - ${BACKUP_HOST_DIR:-./backups}:/app/backups
      - ${BACKGROUND_HOST_DIR:-./backgrounds}:/app/backgrounds:ro
      
    restart: unless-stopped
